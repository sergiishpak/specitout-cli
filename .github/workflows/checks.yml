name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit-and-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]' build
      - run: python -m pytest -q
      - run: python -m build
      - name: Verify wheel outside checkout
        shell: bash
        run: |
          python -m venv /tmp/specitout-wheel
          /tmp/specitout-wheel/bin/pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/specitout-wheel/bin/specitout --version
          /tmp/specitout-wheel/bin/specitout --help
          /tmp/specitout-wheel/bin/python -c "from importlib.resources import files; assert files('specitout').joinpath('resources/runtime/migrations/0001_specitout_runtime_baseline.sql').is_file()"
  native-ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install matching native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-contrib-16 postgresql-16-pgvector
      - name: Install native test dependencies
        run: |
          python -m pip install 'psycopg[binary]>=3.2,<4' 'pytest>=8,<9'
          python -m pip install --no-deps -e .
      - name: Exercise native workspace lifecycle
        env:
          SPECITOUT_TEST_POSTGRES: '1'
          SPECITOUT_POSTGRES_BIN_DIR: /usr/lib/postgresql/16/bin
        run: python -m pytest tests/test_postgres_smoke.py -q
