<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1030" viewBox="0 0 1120 1030" role="img" aria-labelledby="title desc"><title id="title">Local Bubble export processing</title><desc id="desc">Six local stages: validation, normalization, graph storage, search documents, CPU embeddings, and readiness plus activation. Initial model-file download is separate from each export’s local compute. No durations are claimed.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#53727a" stroke-width="1.6"/></marker></defs><style>text{font-family:Inter,Arial,sans-serif;fill:#17343d}.title{font-size:32px;font-weight:700}.subtitle{font-size:17px;fill:#526c73}.label{font-size:13px;font-weight:700;letter-spacing:1.6px;fill:#426a72}.heading{font-size:20px;font-weight:700}.body{font-size:16px;fill:#42606a}.small{font-size:14px;fill:#526c73}.num{font-size:16px;font-weight:700;fill:#087b75}.line{fill:none;stroke:#53727a;stroke-width:2;marker-end:url(#arrow)}</style><rect width="100%" height="100%" fill="#f5f8f5"/><text x="42" y="52" class="title"><tspan x="42" dy="0">From Bubble export to a local evidence index</tspan></text><text x="42" y="86" class="subtitle"><tspan x="42" dy="0">CPU onboarding profile · six stages per export version · no chat model in this pipeline.</tspan></text><rect x="28" y="123" width="708" height="881" rx="22" fill="#e8f3ef" stroke="#b8d7cf"/><text x="52" y="158" class="label"><tspan x="52" dy="0">ON YOUR COMPUTER</tspan></text><text x="52" y="188" class="heading"><tspan x="52" dy="0">Python CLI  ·  native Postgres + pgvector</tspan></text><rect x="52" y="214" width="660" height="100" rx="14" fill="#fff" stroke="#d5e3e1"/><rect x="68" y="232" width="42" height="34" rx="9" fill="#e2f2ec" stroke="#e2f2ec"/><text x="77" y="255" class="num"><tspan x="77" dy="0">01</tspan></text><text x="126" y="249" class="heading"><tspan x="126" dy="0">Validate &amp; fingerprint</tspan></text><text x="126" y="282" class="small"><tspan x="126" dy="0">Read the private export; check its shape and source identity.</tspan></text><path d="M382 314V334" class="line"/><rect x="52" y="338" width="660" height="100" rx="14" fill="#fff" stroke="#d5e3e1"/><rect x="68" y="356" width="42" height="34" rx="9" fill="#e2f2ec" stroke="#e2f2ec"/><text x="77" y="379" class="num"><tspan x="77" dy="0">02</tspan></text><text x="126" y="373" class="heading"><tspan x="126" dy="0">Parse &amp; normalize</tspan></text><text x="126" y="406" class="small"><tspan x="126" dy="0">Extract entities, relationships and source references.</tspan></text><path d="M382 438V458" class="line"/><rect x="52" y="462" width="660" height="100" rx="14" fill="#fff" stroke="#d5e3e1"/><rect x="68" y="480" width="42" height="34" rx="9" fill="#e2f2ec" stroke="#e2f2ec"/><text x="77" y="503" class="num"><tspan x="77" dy="0">03</tspan></text><text x="126" y="497" class="heading"><tspan x="126" dy="0">Store the application graph</tspan></text><text x="126" y="530" class="small"><tspan x="126" dy="0">Keep versioned structure and evidence in local Postgres.</tspan></text><path d="M382 562V582" class="line"/><rect x="52" y="586" width="660" height="100" rx="14" fill="#fff" stroke="#d5e3e1"/><rect x="68" y="604" width="42" height="34" rx="9" fill="#e2f2ec" stroke="#e2f2ec"/><text x="77" y="627" class="num"><tspan x="77" dy="0">04</tspan></text><text x="126" y="621" class="heading"><tspan x="126" dy="0">Build search documents</tspan></text><text x="126" y="654" class="small"><tspan x="126" dy="0">Prepare exact / lexical lookup and semantic search text.</tspan></text><path d="M382 686V706" class="line"/><rect x="52" y="710" width="660" height="100" rx="14" fill="#fff" stroke="#d5e3e1"/><rect x="68" y="728" width="42" height="34" rx="9" fill="#e2f2ec" stroke="#e2f2ec"/><text x="77" y="751" class="num"><tspan x="77" dy="0">05</tspan></text><text x="126" y="745" class="heading"><tspan x="126" dy="0">Compute embeddings locally</tspan></text><text x="126" y="778" class="small"><tspan x="126" dy="0">sentence-transformers · BAAI/bge-small-en-v1.5 · CPU</tspan></text><path d="M382 810V830" class="line"/><rect x="52" y="834" width="660" height="100" rx="14" fill="#fff" stroke="#d5e3e1"/><rect x="68" y="852" width="42" height="34" rx="9" fill="#e2f2ec" stroke="#e2f2ec"/><text x="77" y="875" class="num"><tspan x="77" dy="0">06</tspan></text><text x="126" y="869" class="heading"><tspan x="126" dy="0">Verify readiness &amp; activate</tspan></text><text x="126" y="902" class="small"><tspan x="126" dy="0">Check stored counts and readiness; select the ready version.</tspan></text><text x="52" y="981" class="small"><tspan x="52" dy="0">Files and computation stay local during this pipeline.</tspan></text><rect x="766" y="214" width="326" height="245" rx="14" fill="#fff4df" stroke="#e6ce98"/><text x="788" y="248" class="label"><tspan x="788" dy="0">FIRST MODEL USE</tspan></text><text x="788" y="283" class="heading"><tspan x="788" dy="0">Download model files</tspan></text><text x="788" y="316" class="body"><tspan x="788" dy="0">Network access may be needed</tspan><tspan x="788" dy="23">to populate the model cache.</tspan><tspan x="788" dy="23">This is setup work, separate</tspan><tspan x="788" dy="23">from per-export computation.</tspan></text><text x="788" y="429" class="small"><tspan x="788" dy="0">Reuse the cache on later runs.</tspan></text><rect x="766" y="491" width="326" height="223" rx="14" fill="#fff" stroke="#d5e3e1"/><text x="788" y="526" class="label"><tspan x="788" dy="0">PER-EXPORT WORK</tspan></text><text x="788" y="559" class="heading"><tspan x="788" dy="0">Measure, don’t guess</tspan></text><text x="788" y="593" class="body"><tspan x="788" dy="0">Time depends on export size,</tspan><tspan x="788" dy="23">CPU, storage and cache state.</tspan><tspan x="788" dy="23">Read elapsed time and actual</tspan><tspan x="788" dy="23">counts as stages progress.</tspan></text><text x="788" y="692" class="small"><tspan x="788" dy="0">No benchmark duration claimed.</tspan></text><rect x="766" y="746" width="326" height="219" rx="14" fill="#eaf0f8" stroke="#cbd7e6"/><text x="788" y="782" class="label"><tspan x="788" dy="0">LOCAL MODEL ≠ CHAT LLM</tspan></text><text x="788" y="818" class="body"><tspan x="788" dy="0">Embeddings organize search.</tspan><tspan x="788" dy="23">The agent’s language model</tspan><tspan x="788" dy="23">answers later, using selected</tspan><tspan x="788" dy="23">evidence from the index.</tspan></text><text x="788" y="938" class="small"><tspan x="788" dy="0">See the separate answering flow.</tspan></text></svg>