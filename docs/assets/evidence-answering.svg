<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1225" viewBox="0 0 1120 1225" role="img" aria-labelledby="title desc"><title id="title">Retrieval and agent answering</title><desc id="desc">A question goes to an agent, then the local CLI combines exact, lexical and vector retrieval with graph traversal. Bounded source evidence returns to the agent LLM, which answers with citations. A hosted LLM can receive that evidence.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#53727a" stroke-width="1.6"/></marker></defs><style>text{font-family:Inter,Arial,sans-serif;fill:#17343d}.title{font-size:32px;font-weight:700}.subtitle{font-size:17px;fill:#526c73}.label{font-size:13px;font-weight:700;letter-spacing:1.6px;fill:#426a72}.heading{font-size:20px;font-weight:700}.body{font-size:16px;fill:#42606a}.small{font-size:14px;fill:#526c73}.num{font-size:16px;font-weight:700;fill:#087b75}.line{fill:none;stroke:#53727a;stroke-width:2;marker-end:url(#arrow)}</style><rect width="100%" height="100%" fill="#f5f8f5"/><text x="42" y="52" class="title"><tspan x="42" dy="0">From a question to an evidence-backed answer</tspan></text><text x="42" y="86" class="subtitle"><tspan x="42" dy="0">The CLI retrieves structure. Your agent’s LLM interprets the evidence.</tspan></text><rect x="178" y="116" width="764" height="69" rx="14" fill="#fff" stroke="#d5e3e1"/><text x="202" y="146" class="label"><tspan x="202" dy="0">YOU</tspan></text><text x="296" y="158" class="heading"><tspan x="296" dy="0">“What depends on this workflow?”</tspan></text><path d="M560 185V210" class="line"/><rect x="178" y="215" width="764" height="78" rx="14" fill="#eaf0f8" stroke="#cbd7e6"/><text x="202" y="248" class="label"><tspan x="202" dy="0">AGENT + SPECITOUT SKILL</tspan></text><text x="202" y="274" class="body"><tspan x="202" dy="0">Resolve the workspace and version; choose a narrow investigation.</tspan></text><path d="M560 293V323" class="line"/><rect x="28" y="329" width="1064" height="500" rx="22" fill="#e8f3ef" stroke="#b8d7cf"/><text x="52" y="365" class="label"><tspan x="52" dy="0">ON YOUR COMPUTER</tspan></text><text x="52" y="397" class="heading"><tspan x="52" dy="0">Python CLI → local Postgres + pgvector</tspan></text><rect x="52" y="421" width="316" height="107" rx="14" fill="#fff" stroke="#d5e3e1"/><text x="70" y="454" class="heading"><tspan x="70" dy="0">Exact</tspan></text><text x="70" y="484" class="small"><tspan x="70" dy="0">Identifiers and canonical keys</tspan><tspan x="70" dy="21">when you know an anchor.</tspan></text><rect x="402" y="421" width="316" height="107" rx="14" fill="#fff" stroke="#d5e3e1"/><text x="420" y="454" class="heading"><tspan x="420" dy="0">Lexical</tspan></text><text x="420" y="484" class="small"><tspan x="420" dy="0">Words and names from</tspan><tspan x="420" dy="21">the exported structure.</tspan></text><rect x="752" y="421" width="316" height="107" rx="14" fill="#fff" stroke="#d5e3e1"/><text x="770" y="454" class="heading"><tspan x="770" dy="0">Vector</tspan></text><text x="770" y="484" class="small"><tspan x="770" dy="0">Local query embeddings find</tspan><tspan x="770" dy="21">semantically related text.</tspan></text><path d="M560 528V553" class="line"/><rect x="178" y="559" width="764" height="91" rx="14" fill="#fff" stroke="#d5e3e1"/><text x="202" y="592" class="heading"><tspan x="202" dy="0">Follow the graph</tspan></text><text x="202" y="620" class="body"><tspan x="202" dy="0">Inspect entities, inbound / outbound usage and bounded connection paths.</tspan></text><path d="M560 650V675" class="line"/><rect x="178" y="681" width="764" height="112" rx="14" fill="#fff" stroke="#d5e3e1"/><text x="202" y="716" class="heading"><tspan x="202" dy="0">Return a bounded evidence bundle</tspan></text><text x="202" y="747" class="body"><tspan x="202" dy="0">Selected entities + edges + source references + retrieval limits.</tspan><tspan x="202" dy="23">Caps and truncation matter: a bundle is not the whole application.</tspan></text><path d="M560 829V856" class="line"/><rect x="178" y="862" width="764" height="101" rx="14" fill="#fff4df" stroke="#e6ce98"/><text x="202" y="896" class="label"><tspan x="202" dy="0">AGENT’S LLM</tspan></text><text x="202" y="929" class="body"><tspan x="202" dy="0">Use the retrieved evidence to compose an answer with source citations.</tspan></text><path d="M560 963V988" class="line"/><rect x="178" y="994" width="764" height="78" rx="14" fill="#fff" stroke="#d5e3e1"/><text x="202" y="1027" class="heading"><tspan x="202" dy="0">Answer + evidence + uncertainty</tspan></text><text x="202" y="1053" class="body"><tspan x="202" dy="0">Observed structure is separate from inferred intent or missing evidence.</tspan></text><text x="60" y="1116" class="body"><tspan x="60" dy="0">Data boundary: the CLI computes locally. If the agent uses a hosted LLM, selected evidence</tspan><tspan x="60" dy="25">can leave this computer under that agent provider’s data handling. Local embeddings do not</tspan><tspan x="60" dy="25">make a hosted conversation private. The CLI does not execute or edit the live Bubble app.</tspan></text></svg>